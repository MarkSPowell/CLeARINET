name: Release Windows Installer

# Builds a self-contained win-x64 publish of the desktop app, packages it
# with Inno Setup into one setup.exe that can install either per-machine
# (Program Files, needs an admin elevation prompt) or per-user (the current
# user's own AppData\Local\Programs folder, no admin needed at all -- the
# person picks at install time; see installer/VioLens.iss for how), and
# attaches that installer to the GitHub Release for the pushed tag. Separate
# from ci.yml on purpose: ci.yml runs on every push/PR to build+test both
# supported OSes; this only runs on an actual version tag, and only builds
# for Windows, since Inno Setup itself is Windows-only tooling and this
# workflow's whole job is producing a release artifact, not verifying the
# code.
#
# Also runnable by hand (workflow_dispatch) for a test build without
# cutting a real tag/Release -- see the "version" input below. A manual run
# still uploads the installer as a build artifact (Actions tab -> this
# run -> Artifacts), it just never touches a GitHub Release, since
# softprops/action-gh-release below is explicitly gated on this being a
# tag push.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to stamp a manual test build with (e.g. 0.1.0). Ignored
          on a real tag push, which derives this from the tag itself
          instead.
        required: false
        default: "0.0.0"

# id-token: write lets the job sign in to Azure with GitHub's own OIDC
# token for code signing (see "Sign with Azure Artifact Signing" below),
# so no Azure password or secret key is stored in the repository.
permissions:
  contents: write
  id-token: write

# Code signing (Azure Artifact Signing) runs only when these repository
# variables are set (Settings > Secrets and variables > Actions >
# Variables); without them the build is unsigned, as before:
#   ARTIFACT_SIGNING_ENDPOINT  e.g. https://eus.codesigning.azure.net/
#   ARTIFACT_SIGNING_ACCOUNT   the Artifact Signing account name
#   ARTIFACT_SIGNING_PROFILE   the certificate profile name
# plus these repository secrets for the Azure sign-in:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID

jobs:
  build-installer:
    runs-on: windows-latest
    # The Azure sign-in for code signing trusts this environment by name
    # (one federated credential covers tag releases and manual runs alike;
    # Azure can't match a pattern such as "every v* tag").
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # A tag push always wins over the workflow_dispatch input -- the
          # tag is the actual source of truth for a real release; the
          # input only exists for a manual test build with no tag at all.
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF -replace "refs/tags/v", ""
          } else {
            $version = "${{ inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($version)) {
              $version = "0.0.0"
            }
          }
          Write-Host "Building installer version $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

          # A separate, strictly-numeric X.X.X.X derivative of the version
          # above, for the two places downstream that can't accept a
          # prerelease suffix like "-preview.1" at all: dotnet publish's
          # own AssemblyVersion/FileVersion (InformationalVersion, set
          # alongside it below, is what keeps the full string -- see
          # AboutWindow.axaml.cs's own remarks) and Inno Setup's
          # VersionInfoVersion directive (installer/VioLens.iss's own
          # VersionInfoTextVersion is the equivalent full-string escape
          # hatch there). Drops everything from the first "-" onward, then
          # pads with trailing ".0"s so there are always exactly four
          # numeric components -- both targets are stricter about the
          # component count than they are forgiving about a missing one.
          $versionCore = ($version -split "-")[0]
          $parts = @($versionCore -split "\.")
          while ($parts.Count -lt 4) {
            $parts += "0"
          }
          $fileVersion = ($parts[0..3] -join ".")
          Write-Host "Numeric file/product version: $fileVersion"
          echo "fileVersion=$fileVersion" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore VioLens.sln

      # Self-contained: bundles the .NET 10 runtime into the published
      # output, so the installer works on a machine with no .NET installed
      # at all -- VioLens's own users are the target audience this
      # matters for, not developers who already have the SDK. Publishing
      # only the desktop app project (not the whole solution) is
      # deliberate: DevHost/FiddlerScriptDemo/SampleExtension and the test
      # projects are developer-only tools, not part of what ships to an
      # end user. PublishSingleFile bundles the app's own assemblies into
      # one .exe; loose content files (like the bundled User Guide.md --
      # see Violens.DesktopUi.csproj's own None/Link entry for it) are
      # NOT folded into that single file by design, and still land next to
      # it in the publish output, which is exactly what
      # OpenDocumentationCommand's AppContext.BaseDirectory-relative path
      # expects.
      - name: Publish self-contained win-x64 build
        run: >-
          dotnet publish apps/Violens.DesktopUi/Violens.DesktopUi.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          --output publish/win-x64

                # Independently built from the main app on purpose -- see this
      # project's own csproj header comment ("deliberately NOT referenced
      # by the main VioLens.sln/apps/Violens.DesktopUi... so it can
      # never affect the main app's build or release"). This step exists
      # only so the installer below has something to package for the
      # optional "legacyhost" Task; skipping/failing it would never affect
      # the main app's own publish step above, which already ran.
      #
      # Plain `dotnet build` with --output, not `dotnet publish`: this is a
      # net48 project (framework-dependent, not self-contained the way the
      # win-x64 net10 app above is -- .NET Framework 4.8 ships with Windows
      # 10/11 already, the same dependency real Fiddler Classic itself
      # had), so there's no publish-specific packaging step to gain here.
      # --output flattens this project's own build output *and* its
      # ProjectReferences' outputs (Violens.CompatShim.dll,
      # Violens.LegacyExtensionHost.Bridge.dll) into one folder, exactly
      # matching what Violens.LegacyExtensionHost.csproj's own
      # CopyOutputToDesktopUiLegacyHostFolder dev-build step already copies
      # into a local LegacyHost folder -- see that target's own remarks.
      # No explicit --runtime win-x86: the project's own PlatformTarget=x86
      # (pinned for real extensions like AustralianImages.dll that only
      # load 32-bit) already governs the bitness of what gets built; win-x86
      # would ask for a self-contained-style RID-qualified output this
      # framework-dependent project doesn't need.
      - name: Build legacy extension host (optional installer component)
        run: >-
          dotnet build tools/Violens.LegacyExtensionHost/Violens.LegacyExtensionHost/Violens.LegacyExtensionHost.csproj
          --configuration Release
          --output publish/legacyhost

      - name: Build optional extensions
        shell: pwsh
        run: ./installer/build-extensions.ps1 -OutputDir publish/extensions

      # The proxy host, for apps on .NET Framework that use the engine
      # through Violens.ProxyHost.Client (see docs/Embedding ProxyCore.md).
      # Self-contained and single-file, so the app's users don't need .NET
      # 10 installed. Not part of the installer: it's attached to the
      # release as its own zip below, and signed with everything else here.
      - name: Publish the proxy host
        run: >-
          dotnet publish src/Violens.ProxyHost/Violens.ProxyHost.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          --output publish/proxyhost

      - name: Sign in to Azure for code signing
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # Signing only needs the sign-in itself, not access to a whole
          # subscription (the app's one role is on the signing account).
          allow-no-subscriptions: true

      # Everything the installer will put on disk -- the app itself, the
      # optional legacy extension host and the optional extensions -- is
      # signed before Inno Setup packs it, so the installed files are signed
      # too, not just the installer. Only files that aren't signed already:
      # a file its publisher signed (Microsoft's own, say) keeps that.
      - name: List files to sign
        id: tosign
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish -Recurse -Include *.exe,*.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' } |
            ForEach-Object { $_.FullName })
          Write-Host "Signing $($files.Count) files:"
          $files | ForEach-Object { Write-Host "  $_" }
          "files<<SIGN_EOF" >> $env:GITHUB_OUTPUT
          $files >> $env:GITHUB_OUTPUT
          "SIGN_EOF" >> $env:GITHUB_OUTPUT

      - name: Sign the app and optional components
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.tosign.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: VioLens
          description-url: https://github.com/MarkSPowell/VioLens

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # With signing set up, Inno Setup signs the installer and the
      # uninstaller it builds into it (the uninstaller can only be signed
      # while Inno Setup builds it), through installer/sign-file.ps1. $f is
      # Inno Setup's placeholder for the (quoted) file to sign; $q is a quote.
      - name: Build installer
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $signing = @()
          if ($env:ARTIFACT_SIGNING_ACCOUNT) {
            Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Repository PSGallery -Scope CurrentUser -Force
            $script = Join-Path $env:GITHUB_WORKSPACE "installer\sign-file.ps1"
            $signing = @(
              "/DSignToolName=artifact",
              "/Sartifact=pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `$q$script`$q -Path `$f"
            )
          }

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyFileVersion=${{ steps.version.outputs.fileVersion }}" `
            "/DPublishDir=${{ github.workspace }}\publish\win-x64" `
            "/DLegacyHostDir=${{ github.workspace }}\publish\legacyhost" `
            "/DExtensionsDir=${{ github.workspace }}\publish\extensions" `
            @signing `
            installer\VioLens.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Fails the release if anything that should be signed isn't, so an
      # unsigned build can't go out by accident once signing is set up.
      - name: Check signatures
        if: vars.ARTIFACT_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          $files = @(Get-ChildItem installer/Output -Filter *.exe) + @(Get-ChildItem publish -Recurse -Include *.exe,*.dll)
          $unsigned = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($unsigned) {
            $unsigned | ForEach-Object { Write-Host "Not signed: $($_.FullName)" }
            exit 1
          }
          Write-Host "All $($files.Count) files are signed."

      - name: Upload installer as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: VioLens-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/VioLens-Setup-*.exe
          if-no-files-found: error

      # Only on a real tag push -- a workflow_dispatch test build has no
      # Release to attach to, and shouldn't create one on your behalf.
      - name: Attach installer to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/VioLens-Setup-*.exe
          fail_on_unmatched_files: true
      # The proxy engine as a NuGet package, with the same version as the
      # app (see docs/Embedding ProxyCore.md). Packed on every run so a
      # test build can check it; pushed to nuget.org only on a real tag and
      # only once a NUGET_API_KEY secret exists (Settings > Secrets and
      # variables > Actions). --skip-duplicate makes re-running a release
      # harmless: a version already on nuget.org is left as it is.
      - name: Pack Violens.ProxyCore
        run: >-
          dotnet pack src/Violens.ProxyCore/Violens.ProxyCore.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output packages

      - name: Pack Violens.ProxyHost.Client
        run: >-
          dotnet pack src/Violens.ProxyHost.Client/Violens.ProxyHost.Client.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output packages

      - name: Zip the proxy host
        shell: pwsh
        run: Compress-Archive -Path publish/proxyhost/* -DestinationPath "packages/Violens.ProxyHost-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Attach the proxy host to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/Violens.ProxyHost-*-win-x64.zip
          fail_on_unmatched_files: true

      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Violens.ProxyCore-${{ steps.version.outputs.version }}
          path: packages/*
          if-no-files-found: error

      - name: Publish Violens.ProxyCore to nuget.org
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:NUGET_API_KEY)) {
            Write-Host "No NUGET_API_KEY secret yet, so the package isn't published (it's still a build artifact)."
            exit 0
          }
          dotnet nuget push "packages/*.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
