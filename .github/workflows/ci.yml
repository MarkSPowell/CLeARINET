name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CLeARINET.sln

      - name: Build
        run: dotnet build CLeARINET.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CLeARINET.sln --no-build --configuration Release --verbosity normal

      - name: Fetch and port upstream extensions
        shell: pwsh
        run: ./tests/ExtensionPorts/port.ps1

      - name: Test ported extensions
        run: dotnet test tests/ExtensionPorts/Clearinet.ExtensionPorts.Tests/Clearinet.ExtensionPorts.Tests.csproj --configuration Release --verbosity normal